<style>
:root{
  --bg1:#070b24; --bg2:#1b1145; --ink:#ffffff; --muted:#b9c2f0;
  --navy:#16204d; --star:#ffd34d; --orange:#ff8a3d; --pink:#ff5fa2; --teal:#37e0c8; --purple:#8b6cff;
  --panel:rgba(22,30,80,.72); --panel2:rgba(40,50,120,.55);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;height:100%;background:#0b0d2e}
body{margin:0;min-height:100%;color:var(--ink);background:radial-gradient(ellipse at 20% 0%,#2a1a6b 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#123a6b 0%,transparent 50%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden;font-size:18px;line-height:1.3}
a{color:inherit}
a:focus{outline:none}
a:focus-visible{outline:3px solid var(--star);outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.deco{position:fixed;z-index:0;pointer-events:none;border-radius:50%}
.planet{width:38vmin;height:38vmin;left:-14vmin;bottom:-14vmin;background:radial-gradient(circle at 35% 30%,#ff9ec4,#a04fd0 55%,#3b1a70 80%);opacity:.35}
.planet::after{content:"";position:absolute;left:-18%;top:42%;width:136%;height:16%;border-radius:50%;border:3px solid rgba(255,220,160,.55);transform:rotate(-18deg)}
.moon{width:11vmin;height:11vmin;right:3vmin;bottom:16vh;background:radial-gradient(circle at 35% 35%,#fff7d6,#ffd34d 50%,#c98a1a 90%);opacity:.2}
.shoot{position:fixed;z-index:0;top:12%;left:-10%;width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(18deg);animation:shoot 11s linear 3s infinite;pointer-events:none}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(18deg)}2%{opacity:1}9%{opacity:0;transform:translate(70vw,23vw) rotate(18deg)}100%{opacity:0;transform:translate(70vw,23vw) rotate(18deg)}}
.screen{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) calc(var(--sab) + 18px) calc(var(--sal) + 16px)}
.wrap{width:100%;max-width:980px;margin:auto}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.logo svg{width:54px;height:96px;animation:hover 3s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(255,138,61,.45))}
@keyframes hover{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
h1{margin:0;font-size:clamp(40px,10vw,68px);line-height:1;letter-spacing:1px;font-weight:900;text-shadow:0 4px 0 #2b1d74,0 0 24px rgba(139,108,255,.6)}
h1 span,h2 span{color:var(--star)}
.tag{margin:8px 0 0;text-align:center;font-size:clamp(18px,4.5vw,22px);color:var(--muted);font-weight:700}
.games{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 0;padding:0}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;text-align:center;text-decoration:none;background:var(--panel);border:3px solid rgba(160,180,255,.28);border-radius:28px;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation}
.mark{height:96px;display:grid;place-items:center}
.mark .rocket{width:50px;height:90px;filter:drop-shadow(0 6px 12px rgba(255,138,61,.4))}
.mark .target{width:86px;height:86px;filter:drop-shadow(0 6px 12px rgba(55,224,200,.28))}
h2{margin:0;font-size:clamp(28px,6vw,36px);line-height:1.05;font-weight:900}
.blurb{margin:0;max-width:18em;min-height:2.6em;font-size:20px;font-weight:700;color:var(--muted)}
.cta{margin-top:auto;width:100%;min-height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;letter-spacing:.5px}
.go{background:linear-gradient(180deg,#ffb14d,#ff6a3d);color:#2a0f00;box-shadow:0 6px 0 #b8431c,0 10px 24px rgba(255,106,61,.4)}
a.card:active{transform:translateY(2px)}
a.card:active .go{transform:translateY(4px);box-shadow:0 2px 0 #b8431c}
.soon{background:rgba(16,22,60,.55);border-style:dashed;border-color:rgba(255,211,77,.5);box-shadow:none}
.soon-label{background:rgba(255,211,77,.14);color:var(--star);border:3px dashed rgba(255,211,77,.55)}
@media (hover:hover){
  a.card:hover{border-color:rgba(255,211,77,.75);transform:translateY(-3px)}
  a.card:hover .go{box-shadow:0 6px 0 #b8431c,0 14px 28px rgba(255,106,61,.5)}
}
@media (min-width:800px){
  .games{grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .card{padding:22px 20px 18px}
}
@media (max-width:699px) and (orientation:portrait){
  .logo svg{width:48px;height:86px}
  .mark{height:84px}
  .mark .rocket{width:44px;height:80px}
  .mark .target{width:76px;height:76px}
  .blurb{font-size:18px}
  .cta{min-height:60px;font-size:24px}
  .games{gap:12px;margin-top:14px}
}
@media (prefers-reduced-motion:reduce){
  .logo svg,.shoot{animation:none}
  a.card,.go{transition:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rk" viewBox="0 0 120 220">
      <path d="M44 150 Q60 218 76 150 Z" fill="#ffb03a"/><path d="M51 150 Q60 196 69 150 Z" fill="#fff36b"/>
      <path d="M33 112 L12 162 L40 152 Z" fill="#ff4d6d"/><path d="M87 112 L108 162 L80 152 Z" fill="#ff4d6d"/>
      <path d="M60 6 C90 34 94 96 84 154 L36 154 C26 96 30 34 60 6 Z" fill="#eef2ff"/>
      <path d="M60 6 C72 17 80 30 85 46 L35 46 C40 30 48 17 60 6 Z" fill="#ff4d6d"/>
      <circle cx="60" cy="82" r="16" fill="#3d7bff" stroke="#9fb4ff" stroke-width="6"/><circle cx="54" cy="76" r="5" fill="#fff" opacity=".75"/>
      <rect x="54" y="118" width="12" height="36" rx="4" fill="#ff4d6d"/>
    </symbol>
  </defs>
</svg>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="deco planet" aria-hidden="true"></div>
<div class="deco moon" aria-hidden="true"></div>
<div class="shoot" aria-hidden="true"></div>

<main class="screen">
  <div class="wrap">
    <header class="logo">
      <svg viewBox="0 0 120 220" aria-hidden="true"><use href="#rk"/></svg>
      <h1>Math <span>Games</span></h1>
    </header>
    <p class="tag">For Bodhi and Kaia</p>
    <section class="games" aria-label="Games">
      <a class="card" href="24/">
        <div class="mark"><svg class="rocket" viewBox="0 0 120 220" aria-hidden="true"><use href="#rk"/></svg></div>
        <h2>Rocket <span>24</span></h2>
        <p class="blurb">Use all four numbers to make 24.</p>
        <span class="cta go">Play</span>
      </a>
      <article class="card soon">
        <div class="mark"><svg class="target" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="54" fill="#1a2458" stroke="#ffd34d" stroke-width="8"/>
          <circle cx="60" cy="60" r="34" fill="none" stroke="#37e0c8" stroke-width="8"/>
          <circle cx="60" cy="60" r="12" fill="#ff5fa2"/>
        </svg></div>
        <h2>Target <span>Numbers</span></h2>
        <p class="blurb">Six numbers. Reach the target. Endless play.</p>
        <span class="cta soon-label">Coming soon</span>
      </article>
    </section>
  </div>
</main>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('sky');
  if (!cv || !cv.getContext) return;
  var cx = cv.getContext('2d');
  if (!cx) return;
  var W, H, stars = [], last = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tint = ['#ffffff', '#ffffff', '#ffffff', '#ffe9a8', '#bcd2ff', '#ffc7e3'];
  function size() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(240, W * H / 4500));
    stars = [];
    for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.35, p: Math.random() * 6.28, s: 0.6 + Math.random() * 2.2, c: tint[i % tint.length] });
    draw(performance.now(), true);
  }
  function draw(t, force) {
    if (!force && t - last <= 60) return;
    last = t; cx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      cx.globalAlpha = reduce ? 0.8 : 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(s.p + t / 1000 * s.s));
      cx.fillStyle = s.c; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.2832); cx.fill();
    }
  }
  function loop(t) { if (!document.hidden) draw(t); requestAnimationFrame(loop); }
  addEventListener('resize', size);
  size();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
